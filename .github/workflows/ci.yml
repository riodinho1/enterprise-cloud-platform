# Phase 2 skeleton: install, lint, type-check, test, build.
# Phase 3: PostgreSQL for API tests. Phase 4: SeaweedFS for storage tests.
# Both come from the same compose.yaml used locally, so CI and the laptop cannot drift.
# Phase 10 adds security scans (npm audit, CodeQL, gitleaks, Trivy, Terraform fmt/validate/checkov) and Docker builds.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Throwaway credentials for containers that live for one run and are reachable
      # only from this job. They are not secrets, so they do not need to be.
      POSTGRES_USER: ecp
      POSTGRES_PASSWORD: ci-${{ github.run_id }}
      POSTGRES_DB: ecp
      S3_ACCESS_KEY_ID: ci-access-${{ github.run_id }}
      S3_SECRET_ACCESS_KEY: ci-secret-${{ github.run_id }}
      DATABASE_URL: postgresql://ecp:ci-${{ github.run_id }}@127.0.0.1:5432/ecp_test
      TEST_DATABASE_URL: postgresql://ecp:ci-${{ github.run_id }}@127.0.0.1:5432/ecp_test
      S3_ENDPOINT: http://127.0.0.1:8333
      S3_BUCKET: ecp-documents
      TEST_S3_BUCKET: ecp-documents-test

    steps:
      - uses: actions/checkout@v7

      - name: Start PostgreSQL and SeaweedFS from compose.yaml
        run: docker compose up -d --wait

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Generated fresh for every run; never a committed value.
      - name: Generate a JWT secret for this run
        run: echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - run: npm run lint

      - run: npm run format:check

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail=100
