# Phase 3: PostgreSQL. Phase 4: SeaweedFS (S3 API) for file bytes.
# Phase 5 adds api, web, scan-worker and the app/data network split.
services:
  postgres:
    image: postgres:17-alpine
    container_name: ecp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ecp}
    ports:
      # Bound to loopback only: nothing on the LAN can reach the database.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, when the volume is first created. Creates the test database.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  # SIMULATED stand-in for Amazon S3. "mini" runs master, volume, filer and the S3
  # gateway in one process, sized for a laptop. The admin identity comes from the
  # two AWS_* variables; the API uses the same pair as S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    container_name: ecp-seaweedfs
    command: mini -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0 -s3.port=8333
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    ports:
      - '127.0.0.1:8333:8333'
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/healthz']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres-data:
  seaweedfs-data:
